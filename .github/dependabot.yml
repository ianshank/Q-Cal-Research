# Weekly dependency updates. pyproject.toml, the Dockerfile's base image and .github/ feed
# the checks, so review each update like code. pyproject.toml and .github/ are on the
# enforcement surface: once signing.mode is "enforce", Ian lands an update in a signed commit
# after CI is green.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    groups:
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
      runtime:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    labels: [dependencies]
    commit-message:
      prefix: "docker"
