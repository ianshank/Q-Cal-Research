name: ci

# Head code checks: lint, strict types, the full test suite, and integrity checks that
# need the PR's own code (claims, index and table consistency, licenses, agent layer).
# The trust-sensitive checks (signatures, registry immutability) live in integrity.yml,
# which runs the *base* branch's code under pull_request_target.

on:
  pull_request:
  push:
    branches-ignore: ["claude/**", "gemini/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  tests:
    name: tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python == '3.12'
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  integrity:
    name: integrity checks (head)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e .
      - name: agent layer is valid
        run: python -m qcal agent-layer
      - name: run index matches the records
        run: python -m qcal registry index --check
      - name: tables match the index
        run: python -m qcal registry tables --check
      - name: every number traces to a run
        run: python -m qcal claims
      - name: split manifests are disjoint
        run: python -m qcal leakage --if-present
      - name: licenses and forbidden imports
        run: python -m qcal licenses
