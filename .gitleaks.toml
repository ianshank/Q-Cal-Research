# gitleaks configuration: the default rules plus narrow, documented allowlists.
# Run locally with `make gitleaks`; CI runs the same scan on every push and PR.
title = "q-cal"

[extend]
useDefault = true

[[allowlists]]
description = "Environment-variable placeholders are references, not secrets"
regexTarget = "match"
regexes = ['''\$\{[A-Z_][A-Z0-9_]*\}''']

[[allowlists]]
description = "allowed_signers holds public SSH keys only"
paths = ['''^allowed_signers$''']
