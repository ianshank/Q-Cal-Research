# Local hooks use the project's own tool versions (installed with `make install`).
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: ruff format
        language: system
        types: [python]
      - id: qcal-claims
        name: every number traces to a run
        entry: python -m qcal claims
        language: system
        pass_filenames: false
        files: ^(paper/|README\.md$|CLAIMS\.md$|runs/index\.csv$)
