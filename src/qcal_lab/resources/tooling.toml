# Tooling settings for qcal_lab: the smoke test and the fixture stand-ins.
#
# Not part of any run's config_hash (qcal.toml hashes resources/defaults.toml only): nothing
# here changes what a registered run computes. Science settings belong in defaults.toml.

[smoke]
images = 20
categories = 3
max_objects_per_image = 4
seed = 0
image_width = 640
image_height = 480
max_seconds = 300
seeds = [0]
# Fixture split sizes; they must sum to at most `images`.
split_sizes = { trt_calib_images = 2, calibrator_fit_split = 8, val = 4, test = 6 }
calibrator_fit_split_size = 6
calibrators = ["none", "platt", "isotonic"]
# The smoke project's registry probes only what is cheap and always present.
env_collectors = ["python", "packages"]

[fixture_eval]
# The fixture loop's notion of "found": a fixture-only stand-in, not an evaluation threshold.
hit_iou = 0.5

[protocol_cases]
# Synthetic, protocol-separating inputs (`python -m qcal_lab protocol-cases`): Ian runs the
# oracle on them (tests/parity/cases/README.md). Tooling: they change no run. Set
# iou_threshold, max_detections and bin_count to the oracle's before it runs; the threshold
# grid comes from [calibration] in defaults.toml.
directory = "tests/parity/cases"
image_width = 240
image_height = 240
iou_threshold = 0.5
max_detections = 100
bin_count = 25

[sanity.atss_r50]
# Detector sanity check (D2; src/qcal_lab/sanity.py): the model zoo's box AP for the chosen
# checkpoint in pycocotools units ([0, 1]: 39.4 AP is 0.394), how far the raw AP may be from
# it, and where the value is published. Ian sets all three before the environment spike; the
# commit that sets them is the declaration. Pass/fail only: it never chooses a checkpoint.
zoo_ap = ""
tolerance = ""
source = ""
