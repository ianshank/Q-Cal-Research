# Packaged defaults for qcal_lab, the agent-owned Phase 1 science code.
#
# The repository layer is configs/lab.toml. The registry hashes configs/** into every run's
# config_hash (registry.config_hash_inputs), so science settings come only from files, never
# from environment variables. Tables merge recursively; arrays and scalars replace.
# Empty strings mean "not decided yet": the code refuses to run with them instead of guessing.

[factors]
# EXPERIMENTS.yaml cell keys the experiment program reads, by role.
detector = "detector"
calibrator = "calibrator"
calibrator_scope = "calibrator_scope"
calibrator_fit_split_size = "calibrator_fit_split_size"
shift = "shift"
precision = "precision"
target = "target"                 # where the detector runs: torch_fp32 (Phase 2 adds TensorRT)
quant_path = "quant_path"         # how a quantised model was produced (none in Phase 1)
fit_precision = "fit_precision"   # the precision of the detections calibrators fit on
threshold_regime = "threshold_regime"
split_design = "split_design"     # disjoint fit/select/evaluate splits (D1 may add `paper`)
# Factors accepted with any value because they only label a cell.
passthrough = ["note"]

[factors.defaults]
# Used when a cell omits the factor. Every key here and in [factors.supported] is a role
# above: a factor the program validated and then ignored would label runs it never ran.
calibrator = "none"
calibrator_scope = "per_class"
shift = "id"
precision = "fp32"
target = "torch_fp32"
quant_path = "none"
fit_precision = "fp32"
threshold_regime = "reuse_fp32"
split_design = "disjoint"

[factors.supported]
# Phase 1 is the FP32 reproduction: any other value is refused, never silently ignored.
# Later phases extend these lists in configs/lab.toml.
precision = ["fp32", "fp32_tf32_off"]
target = ["torch_fp32"]
quant_path = ["none"]
fit_precision = ["fp32"]
threshold_regime = ["reuse_fp32"]
split_design = ["disjoint"]
calibrator_scope = ["per_class", "global"]

[splits]
# Roles of the split manifests (qcal `data.splits`). The evaluate split may never also be
# the fit or select split; `qcal leakage` checks the manifests are disjoint.
fit = "calibrator_fit_split"
select = "val"
evaluate = "test"

[datasets.id]
annotations = ""          # COCO-format JSON (docs/data/coco.md); set in configs/lab.toml
images_dir = ""

[detectors.fixture]
kind = "fixture"
seed = 0
detect_probability = 0.9          # chance that an object yields a detection
box_jitter = 0.25                 # max shift of each box edge, as a fraction of its size
label_flip_probability = 0.05
false_positives_per_image = 2
overconfidence = 0.5              # exponent < 1 inflates scores relative to box quality

[detectors.atss_r50]
kind = "mmdet"
config = ""               # MMDetection config file; the environment spike decides (DECISIONS.md)
checkpoint = ""
checkpoint_sha256 = ""    # verified before loading when set
device = "cuda:0"
# Optional MMDetection overrides (model.test_cfg.*); omitted keys keep the config's own values.
# score_threshold = 0.0
# max_per_image = 100

[calibrators]
probability_epsilon = 1e-7        # scores are clipped into [eps, 1 - eps] before the logit
                                  # [not from the paper or the oracle; parity decides]

[calibrators.platt]
max_iterations = 100
gradient_tolerance = 1e-9         # per-sample gradient norm that ends the Newton iterations
ridge = 1e-12                     # always added to the Hessian diagonal (numerical safety)
armijo = 1e-4                     # sufficient-decrease constant of the backtracking line search
min_step = 1e-12                  # smallest step tried before the line search gives up

[calibrators.isotonic]
out_of_bounds = "clip"            # clip | raise (scikit-learn's default "nan" is not a score)
y_min = 0.0
y_max = 1.0
duplicate_resolution = 1e-15      # numpy float64 resolution; scikit-learn uses the input dtype's

[calibration]
# Kuzucu et al., arXiv:2405.20459, Alg. A.1: the calibration threshold u_c is selected on the
# select split (val), the calibrator is fit on fit-split detections scoring >= u_c, and the
# operating threshold v_c is selected on the calibrated select split (CLAUDE.md rule 3).
# The paper does not state its threshold grid; confirm against the oracle before a registered
# run (paper-reproducer). Inclusive of stop.
grid_start = 0.0
grid_stop = 0.95
grid_step = 0.05

[eval_loop]
# Ian's hand-written evaluation loop (CLAUDE.md rule 4). `factory(options)` returns an object
# implementing qcal_lab.evaluation.EvalLoop.
module = "qcal_lab.handwritten.eval_loop"
factory = "build"

[eval_loop.options]

[predictions]
cache_dir = "runs/cache/predictions"   # content-addressed raw predictions; "" disables
# Raw predictions are keyed on the detector settings plus the contents of the files these
# settings name and the versions of these packages, so a replaced checkpoint or an upgrade
# never reuses stale predictions. MMDetection `_base_` configs are not followed: list them
# as settings too if a config inherits.
fingerprint_file_settings = ["config", "checkpoint"]
fingerprint_packages = ["torch", "torchvision", "mmdet", "mmcv", "mmengine", "numpy"]
artifact_dir = "{results_dir}/{run_id}"

[parity]
fixtures_dir = "tests/parity/fixtures"
abs_tolerance = 1e-6
