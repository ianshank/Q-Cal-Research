# Packaged defaults for qcal.
#
# A repository's `qcal.toml` overrides any key here. Tables merge recursively;
# arrays and scalars replace. Environment variables of the form
# QCAL__<SECTION>__<KEY>=<toml value> override both, for example
#   QCAL__LOGGING__LEVEL='"DEBUG"'   or   QCAL__REGISTRY__MAX_RUNS_PER_BATCH=5
# Glob patterns are anchored at the repository root; use "**/" to match at any depth.

[paths]
experiments = "EXPERIMENTS.yaml"
amendments = "AMENDMENTS.md"
decisions = "DECISIONS.md"
claims = "CLAIMS.md"
research_log = "RESEARCH_LOG.md"
registry_dir = "runs/registry"
index_csv = "runs/index.csv"
index_parquet = "runs/index.parquet"
logs_dir = "runs/logs"
results_dir = "runs/results"
tables_dir = "paper/tables"
table_specs_dir = "configs/tables"
manifests_dir = "data/manifests"
dataset_cards_dir = "docs/data"

[logging]
level = "INFO"
format = "text"            # text | json
level_env = "QCAL_LOG_LEVEL"
format_env = "QCAL_LOG_FORMAT"
debug_env = "QCAL_DEBUG"

[git]
protected_branches = ["main"]
timeout_s = 60                        # every git subprocess

[policy]
case_insensitive = true
clean_room_substrings = ["nbcu", "edge-dit", "edge_dit", "edgedit"]

[policy.categories]
ian_only = [
  "EXPERIMENTS.yaml",
  "CLAIMS.md",
  "RESEARCH_LOG.md",
  "DECISIONS.md",
  "**/handwritten/**",
  "paper/sections/abstract*",
  "paper/sections/claims*",
  "paper/sections/limitations*",
  "paper/sections/conclusion*",
]
registry_only = ["runs/index.csv", "runs/index.parquet", "runs/registry/**"]
enforcement_surface = [
  ".claude/**",
  ".github/**",
  ".agents/**",
  ".mcp.json",
  ".pre-commit-config.yaml",
  ".gitleaks.toml",
  "CLAUDE.md",
  "AGENTS.md",
  "Makefile",
  "pyproject.toml",
  "qcal.toml",
  "allowed_signers",
  # The whole qcal package: a new sub-package could shadow a module of the same name.
  # Phase 1 science code lives in the agent-owned src/qcal_lab/ package instead.
  "src/qcal/**",
  "review/gemini-*",
  "review/gemini/**",
  # Files that could shadow or reconfigure the code CI runs on a pull request's head.
  "qcal/**",
  "setup.py",
  "setup.cfg",
  "conftest.py",
  "**/sitecustomize.py",
  "**/usercustomize.py",
  "**/*.pth",
  "ruff.toml",
  ".ruff.toml",
  "mypy.ini",
  ".mypy.ini",
  "pytest.ini",
  "tox.ini",
  "noxfile.py",
  "requirements*.txt",
  "constraints*.txt",
  "uv.lock",
]
# Every committed review is signed: an author cannot approve their own pull request, and
# nobody can flip a verdict or a reviewed_sha after the fact without Ian's signature.
cross_review = ["review/*/**"]
# Edit tools never write git internals: a forged .git file or .git/worktrees entry would
# otherwise move the root that path policy is judged against.
git_internals = [".git", ".git/**", "**/.git", "**/.git/**"]

[policy.messages]
ian_only = "is Ian-only. Propose the change in AMENDMENTS.md or review/ instead."
registry_only = "is written only by the qcal registry CLI."
enforcement_surface = "is part of the enforcement surface; it needs a change proposal and Ian's signed commit."
clean_room = "violates the clean-room rule recorded in DECISIONS.md."
cross_review = "is a committed review; it lands only in Ian's signed commit."
git_internals = "is git's own state; agents never edit it directly."

[signing]
mode = "bootstrap"         # bootstrap (report only) | enforce (fail CI)
allowed_signers = "allowed_signers"
# Run records are signed too: a result enters the record only through Ian's signed commit,
# so a pull request cannot add a fabricated run or supersede an inconvenient one.
signed_categories = ["ian_only", "enforcement_surface", "registry_only", "cross_review"]
# The signing principal in allowed_signers must equal the committer email.
require_committer_match = true
# Verify with this program regardless of the machine's git configuration.
ssh_program = "ssh-keygen"
immutable_dirs = ["runs/registry"]

[review]
# The cross-review merge rule (`qcal ci review-check`, run by integrity.yml).
mode = "bootstrap"                    # bootstrap reports; enforce fails the pull request
path_template = "review/{reviewer}/{slug}.md"   # slug: the branch name with "/" -> "-"
reviewers = ["claude", "gemini"]      # any one of these when no branch prefix matches
approve_verdict = "approve"
post_review_globs = ["review/**"]     # the only paths that may change after reviewed_sha

[review.reviewer_by_branch_prefix]
"claude/" = "gemini"
"gemini/" = "claude"
"antigravity/" = "claude"

[hooks]
mode_env = "QCAL_GUARD_MODE"          # enforce | warn | off, set by the human who launches Claude Code
default_mode = "enforce"
log_file_env = "QCAL_HOOK_LOG"        # JSONL decision log; empty disables
log_file = ""
project_dir_env = "CLAUDE_PROJECT_DIR"
edit_tools = ["Edit", "Write", "MultiEdit", "NotebookEdit"]
path_fields = ["file_path", "path", "notebook_path"]
deny_categories = ["ian_only", "registry_only", "enforcement_surface", "git_internals"]
push_deny_flags = [
  "--force", "-f", "--force-with-lease", "--force-if-includes",
  "--mirror", "--all", "--delete", "-d", "--prune",
]
max_nesting_depth = 3                 # bash -c "..." levels the push guard looks inside
# [{ pattern = "<regex>", reason = "<text>" }]. The default keeps agents from overwriting
# Ian's documents with templates; Ian runs `qcal init --force` himself.
extra_bash_deny = [
  { pattern = '(?:^|[\s;&|(])(?:qcal|-m\s+qcal)\s+(?:--?[\w-]+(?:[ =][^\s;&|]+)?\s+)*init\b[^;&|]*--force', reason = "qcal init --force overwrites Ian's documents; only Ian runs it" },
]

[registry]
run_id_template = "R{timestamp}-{cell_id}-s{seed}-{nonce}"
timestamp_format = "%Y%m%dT%H%M%SZ"
nonce_bytes = 3
env_collectors = ["python", "host", "git", "packages", "nvidia", "torch", "tensorrt", "jetson"]
env_command_timeout_s = 10           # per external probe (nvidia-smi, nvpmodel)
config_hash_inputs = ["configs/**/*.yaml", "configs/**/*.yml", "configs/**/*.toml"]
max_runs_per_batch = 50
require_clean_tree = false
require_supersede_reason = true       # `--reason` is recorded in provenance.supersede_reason
ok_status = "ok"
failed_status = "failed"
write_parquet = "auto"                # auto | always | never
core_columns = [
  "run_id", "cell_id", "seed", "seed_role", "status", "supersedes",
  "started_at", "finished_at", "duration_s", "git_sha", "git_dirty", "config_hash",
]

[registry.column_prefixes]
factors = "factor."
metrics = "metric."
environment = "env."

[executor]
kind = "subprocess"                   # registered executor used when --executor is not given
command = []                          # argv template; placeholders: {run_id} {cell_id} {seed} {seed_role} {result_path} {log_path} {root}
timeout_s = 0                         # 0 disables the timeout
result_filename = "{run_id}.json"
log_filename = "{run_id}.log"
env_prefix = "QCAL_RUN_"

[experiments]
cells_key = "cells"
design_key = "design"
seeds_key = "seeds"
seed_role_key = "seed_role"
default_seed_role = "seed"
cell_id_key = "id"
cell_id_prefix = "C-"
cell_id_hash_length = 10
max_cells_warning = 2000
placeholder_marker = "ian:"
amendment_heading_pattern = '^##\s+\d{4}-\d{2}-\d{2}'

[tables]
macro = "qcalval"
default_digits = 2
default_agg = "mean"
missing_cell = "--"
spec_glob = "*.toml"
rule = "\\hline"
float_placement = "t"
allow_pooled_cells = false            # true lets one table row or reference average several cells

[claims]
tex_globs = ["paper/**/*.tex"]
# CLAUDE.md rule 1: every number in paper/, README.md and CLAIMS.md comes from the index.
strict_tex_globs = ["paper/**/*.tex"]
markdown_globs = ["README.md", "CLAIMS.md"]
strict_markdown_globs = ["CLAIMS.md", "README.md"]
markdown_ref_pattern = '(?P<value>-?\d+(?:\.\d+)?)\s*\((?P<ref>(?:run|agg):[^)\s]+)\)'
# Units may follow (2.3ms, 1.5x); a range (0.03--0.05) or pair (0.04/41.2) shows each number;
# "Apache-2.0" and "fig/1.5" (a word right before the - or /) are names, not results.
number_pattern = '(?<![\w.:])(?<!\w[-/])-?(?:\d+\.\d+|\.\d+)(?!\.\d)'
# A tagged value must be exactly one number (optionally in math mode or with a percent sign),
# so "41.2 (vs. 97.3)" cannot smuggle a second, unverified number past the checker.
# Text touching a tagged value that changes it: a sign before ($-$, -, +, \textminus, but
# not the en-dash of a range), or a digit or point directly before or after.
value_prefix_pattern = '(?:[\d.]|(?:(?<!-)[-+\u2212]|\$[-+\u2212]\$|\\textminus)\s*\$?)$'
value_suffix_pattern = '\d|\.\d'
# A reference must name every current run of its cell (agg over all seeds), never a subset.
require_complete_runs = true
displayed_value_pattern = '\s*\$?\s*(?P<number>-?(?:\d+(?:\.\d+)?|\.\d+))\s*\$?(?:\s|~|\\[,;:! ])*(?:\\?%)?\s*'
# Whole numbers are flagged only when written as a result (percent, points, pp).
integer_result_pattern = '(?<![\w.:])(?<!\w[-/])-?\d+\s*(?:\\?%|points?\b|pts?\b|pp\b|percentage points?\b|[x\u00d7](?!\w)|ms\b|fps\b)'
# Escape hatches (the ignore marker and \qcalfixed{...}) work only in files of these policy
# categories, so an agent cannot use them to hide a number in a file it may edit.
escape_hatch_categories = ["ian_only"]
escape_patterns = ['\\qcalfixed\{[^}]*\}']
tex_ignore_patterns = [
  '(?<!\\)%.*$',
  # Arguments that are never rendered as text. \url and citation notes ([p. 3: 97.3]) are
  # rendered, so they are scanned; only the citation command name is removed.
  '\\(?:ref|eqref|autoref|cref|Cref|label|href|includegraphics|input|include|usepackage|documentclass|bibliography(?:style)?|vspace\*?|hspace\*?|resizebox|scalebox)\s*(?:\[[^\]]*\])?\s*\{[^}]*\}',
  '\\(?:cite[tp]?|citealp|citeauthor|citeyear)\*?(?=\s*[\[{])',
  '\\definecolor\s*\{[^}]*\}\s*\{[^}]*\}\s*\{[^}]*\}',
  '\\(?:setlength|addtolength)\s*\{[^}]*\}\s*\{[^}]*\}',
  # TeX lengths only as arguments ({4pt}, [width=3cm], =0.5em); "4.1pt" in prose is a result.
  '(?<=[{\[=,])\s*-?\d*\.?\d+\s*(?:em|ex|pt|pc|cm|mm|in|bp|mu|sp|dd|cc)\b',
  '\\renewcommand\s*\{?\\arraystretch\}?\s*\{[^}]*\}',
  '\\(?:linespread|setstretch)\s*\{[^}]*\}',
  'https?://[^\s}]+',
  '-?\d*\.\d+\s*\\(?:linewidth|textwidth|columnwidth|hsize|paperwidth|textheight)',
  'arXiv:\s*\d{4}\.\d{4,5}(?:v\d+)?',
  '\bv?\d+\.\d+\.\d+\b',
]
markdown_ignore_patterns = [
  '`[^`]*`',
  'https?://[^\s)>]+',
  'arXiv:\s*\d{4}\.\d{4,5}(?:v\d+)?',
  '\bv?\d+\.\d+\.\d+\b',
  '\]\([^)]*\)',
]
abs_tolerance = 1e-9
ignore_line_marker = "qcal:ignore"
superseded_is_error = true

[data]
splits = ["trt_calib_images", "calibrator_fit_split", "val", "test"]
manifest_pattern = "{split}.txt"
comment_prefix = "#"

[licenses]
deny_license_substrings = ["AGPL", "SSPL", "Commons Clause"]
warn_license_substrings = ["GPL", "CC-BY-NC", "NonCommercial"]
deny_packages = ["ultralytics"]
import_scan_globs = ["src/**/*.py", "scripts/**/*.py"]
dataset_license_key = "license"
dataset_allowed = []
dataset_denied = []
forbidden_imports = [
  { module = "ultralytics", allowed_globs = [] },
  { module = "detection_calibration", allowed_globs = ["tests/parity/**"] },
]

[agent_layer]
settings_file = ".claude/settings.json"
mcp_file = ".mcp.json"
agents_glob = ".claude/agents/*.md"
skills_glob = ".claude/skills/*/SKILL.md"
agent_required_keys = ["name", "description", "tools"]   # an agent without tools inherits all of them
agent_allowed_keys = [
  "name", "description", "tools", "disallowedTools", "model", "permissionMode", "maxTurns",
  "skills", "mcpServers", "hooks", "memory", "background", "effort", "isolation", "color",
  "initialPrompt", "omitClaudeMd",
]
skill_allowed_keys = [
  "name", "description", "when_to_use", "argument-hint", "arguments", "disable-model-invocation",
  "user-invocable", "allowed-tools", "disallowed-tools", "model", "effort", "context", "agent",
  "background", "hooks", "paths", "shell", "metadata", "license", "compatibility",
]
forbidden_permission_modes = ["bypassPermissions"]
hook_wrapper = "run_hook.sh"          # settings commands through it must name a real qcal hook
required_pretooluse_hooks = []        # qcal.toml lists the guards this repository must wire
skill_required_keys = ["description"]
builtin_agents = ["general-purpose", "Explore", "Plan", "statusline-setup", "claude-code-guide"]
# Tool policy: no agent or skill may hold a write-capable tool and a network tool at once.
write_tools = ["Edit", "Write", "MultiEdit", "NotebookEdit", "Bash"]
network_tools = ["WebFetch", "WebSearch"]
network_tool_prefixes = ["mcp__"]
allowed_models = ["inherit", "opus", "sonnet", "haiku", "fable"]
model_id_pattern = "claude-[a-z0-9.-]+"   # full model ids are also accepted
# Hook settings. Extend these lists when Claude Code adds events, tools or sources.
hook_events = [
  "PreToolUse", "PostToolUse", "PostToolUseFailure", "PermissionRequest", "UserPromptSubmit",
  "Notification", "Stop", "StopFailure", "SubagentStart", "SubagentStop", "PreCompact",
  "PostCompact", "SessionStart", "SessionEnd", "TeammateIdle", "TaskCreated", "TaskCompleted",
  "ConfigChange", "InstructionsLoaded", "WorktreeCreate", "WorktreeRemove", "CwdChanged",
  "FileChanged", "Elicitation", "ElicitationResult",
]
tool_matcher_events = ["PreToolUse", "PostToolUse", "PostToolUseFailure", "PermissionRequest"]
known_tools = [
  "Agent", "Task", "Bash", "BashOutput", "KillShell", "Edit", "MultiEdit", "Write", "Read",
  "NotebookEdit", "NotebookRead", "Glob", "Grep", "LS", "WebFetch", "WebSearch", "TodoWrite",
  "Skill", "SlashCommand", "ExitPlanMode", "AskUserQuestion", "LSP", "ToolSearch",
]
session_start_sources = ["startup", "resume", "clear", "compact"]
# Command-reference drift: `qcal ...` and `make <target>` in these files must exist.
makefile = "Makefile"
command_ref_globs = [
  "CLAUDE.md", "AGENTS.md", "README.md", "CONTRIBUTING.md", "Makefile", "Dockerfile",
  ".claude/**/*.md", ".claude/hooks/*.sh", ".github/workflows/*.yml", ".github/*.md",
  "docs/**/*.md", "review/*.md", "scripts/**/*.sh", "configs/**/*.md",
]
command_ref_markdown_globs = ["**/*.md"]
command_ref_skip_fences = ["mermaid", "text", "toml", "json", "python"]   # not shell
# The plan is a design document: it names commands that arrive in later phases.
command_ref_exclude_globs = ["docs/SDLC_IMPLEMENTATION_PLAN.md", "CHANGELOG.md"]

[init]
files = ["experiments", "decisions", "amendments", "claims", "research_log"]
